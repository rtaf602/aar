<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AAR · After Action Review · ฝูง.602</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #eef1f5; --surface: #ffffff; --sunken: #e3e8ee; --ink: #14202d; --muted: #566576; --line: #cbd4de;
  --accent: #1a5a96; --accent-ink: #ffffff; --accent-soft: #dce8f4;
  --ok: #1c7348; --ok-soft: #ddf0e5; --warn: #7d5200; --warn-soft: #faedcf; --bad: #a32f28; --bad-soft: #f7dfdc;
  --font: "Sarabun", "TH Sarabun New", "Leelawadee UI", "Thonburi", "Noto Sans Thai", Tahoma, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

html.dark {
    --bg: #0e151e; --surface: #17212d; --sunken: #111a24; --ink: #e7edf4; --muted: #98a7b8; --line: #2c3b4c;
    --accent: #76b4ea; --accent-ink: #0b1622; --accent-soft: #1b3550;
    --ok: #66c898; --ok-soft: #143524; --warn: #e6b656; --warn-soft: #3a2d0e; --bad: #f09088; --bad-soft: #42201d;
    color-scheme: dark;
  }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.65; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { line-height: 1.3; text-wrap: balance; }
a { color: var(--accent); }
button { font: inherit; }
.wrap { max-width: 1180px; margin-inline: auto; padding: 20px 16px 64px; display: flex; flex-direction: column; gap: 16px; }
.mono { font-family: var(--mono); font-size: .86em; letter-spacing: .02em; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }

/* masthead */
.mast { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: flex-end; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--accent); padding: 16px 20px; }
.unit { font-family: var(--mono); font-size: .76rem; letter-spacing: .12em; color: var(--muted); }
.brand { font-size: 1.7rem; letter-spacing: .03em; line-height: 1.15; margin-top: 4px; }
.brand span { color: var(--accent); }
.who { text-align: right; font-size: .92rem; }
.who b { display: block; }

/* prototype bar */
.proto { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--warn-soft); color: var(--ink); border: 1px dashed var(--warn); padding: 10px 14px; font-size: .92rem; }
.proto .tag { font-family: var(--mono); font-size: .72rem; letter-spacing: .12em; color: var(--warn); font-weight: 700; }
.proto select { width: auto; padding: 4px 8px; }
.proto .sp { flex: 1; }

/* nav */
.nav { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 2px solid var(--line); }
.nav button { background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.nav button[aria-current="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.nav .sp { flex: 1; }
.nav .btn { margin: 4px 0; }

/* panels & controls */
.panel { background: var(--surface); border: 1px solid var(--line); padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span, .lbl { font-size: .84rem; font-weight: 600; color: var(--muted); }
.grow { flex: 1 1 220px; }
input[type=text], input[type=date], input[type=search], input[type=number], select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; width: 100%; min-width: 0; }
textarea { min-height: 96px; resize: vertical; line-height: 1.55; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: .92rem; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 14px; border-radius: 4px; cursor: pointer; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { padding: 3px 10px; font-size: .86rem; font-weight: 500; }
.btn.link { border: 0; background: none; color: var(--accent); padding: 0; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* badges */
.badge { display: inline-block; font-size: .78rem; font-weight: 600; padding: 1px 8px; border-radius: 3px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.badge.acc { background: var(--accent-soft); color: var(--accent); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(3, minmax(130px, 1fr)) minmax(260px, 2fr); gap: 12px; align-items: start; }
@media (max-width: 860px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } .stats .wide { grid-column: 1 / -1; } }
.stat { background: var(--surface); border: 1px solid var(--line); padding: 12px 16px; }
.stat .n { font-size: 1.9rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .t { font-size: .86rem; color: var(--muted); }
.bars { display: grid; grid-template-columns: max-content 1fr max-content; gap: 6px 10px; align-items: center; font-size: .9rem; }
.bar { height: 10px; background: var(--sunken); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }

/* mission cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; text-align: left; color: inherit; font: inherit; }
.card:hover { border-color: var(--accent); }
.card h3 { font-size: 1.05rem; }
.card .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .88rem; color: var(--muted); }
.route { font-family: var(--mono); font-size: .84rem; }
.dcounts { display: flex; flex-wrap: wrap; gap: 4px; }
.dc { font-size: .78rem; padding: 0 7px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); }
.dc.has { border-color: var(--accent); color: var(--accent); font-weight: 600; }

/* tables */
.tblwrap { overflow-x: auto; border: 1px solid var(--line); background: var(--surface); }
table.tbl { border-collapse: collapse; width: 100%; font-size: .92rem; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tbl th { background: var(--sunken); font-size: .82rem; color: var(--muted); white-space: nowrap; position: sticky; top: 0; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--accent-soft); }
.pre { white-space: pre-line; }

/* mission detail */
.mhead { display: flex; flex-direction: column; gap: 8px; }
.mhead h2 { font-size: 1.4rem; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px 16px; font-size: .92rem; }
.kv div span { display: block; font-size: .8rem; color: var(--muted); font-weight: 600; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; cursor: pointer; border-radius: 4px 4px 0 0; border-bottom: 0; color: var(--muted); font-weight: 600; }
.tabs button[aria-current="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tabs button .c { font-weight: 400; opacity: .8; }
.tabbody { border-top: 3px solid var(--accent); padding-top: 14px; display: flex; flex-direction: column; gap: 12px; }
.item { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.item .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 760px) { .item .cols { grid-template-columns: 1fr; } }
.item h4 { font-size: .8rem; color: var(--muted); letter-spacing: .02em; margin-bottom: 2px; }
.item .foot { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: .84rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
.item .foot .sp { flex: 1; }
.item .no { font-family: var(--mono); font-size: .8rem; color: var(--accent); font-weight: 700; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs img { width: 92px; height: 70px; object-fit: cover; border: 1px solid var(--line); cursor: zoom-in; display: block; }
.thumbs .t { position: relative; }
.thumbs .t button { position: absolute; top: 2px; right: 2px; border: 0; background: rgba(0,0,0,.65); color: #fff; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; line-height: 1; }
.empty { padding: 26px; text-align: center; color: var(--muted); border: 1px dashed var(--line); background: var(--surface); }
.dsec { display: flex; flex-direction: column; gap: 8px; }
.dsec > h3 { font-size: 1rem; display: flex; gap: 8px; align-items: center; }

/* GSE */
.chk { display: flex; flex-wrap: wrap; gap: 4px; }
.chk span { font-size: .8rem; padding: 0 7px; border-radius: 3px; }
.chk .y { background: var(--ok-soft); color: var(--ok); }
.chk .n { background: var(--bad-soft); color: var(--bad); text-decoration: line-through; }
.stars { color: #c98a00; letter-spacing: 1px; }
.note { border-left: 4px solid var(--warn); background: var(--warn-soft); padding: 8px 12px; }
.note .by { font-size: .82rem; color: var(--muted); }
.gchk { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 14px; align-items: center; font-size: .92rem; }
.gchk .h { font-size: .8rem; color: var(--muted); font-weight: 600; }

/* modal */
.ov { position: fixed; inset: 0; background: rgba(10, 18, 28, .55); display: flex; align-items: flex-start; justify-content: center; padding: 4vh 12px; z-index: 50; overflow-y: auto; }
.dlg { background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--accent); width: min(760px, 100%); padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.dlg.wide { width: min(1040px, 100%); }
.dlg h2 { font-size: 1.2rem; }
.dlg .acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--line); padding-top: 12px; }
.dlg .acts .sp { flex: 1; }
.err { color: var(--bad); font-weight: 600; font-size: .92rem; }
.info { background: var(--accent-soft); padding: 8px 12px; font-size: .9rem; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 700px) { .cmp { grid-template-columns: 1fr; } }
.cmp > div { border: 1px solid var(--line); padding: 10px 12px; font-size: .92rem; }
.cmp h3 { font-size: .9rem; margin-bottom: 6px; }
.rchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rchips .rc { font-family: var(--mono); font-size: .86rem; background: var(--accent-soft); color: var(--accent); padding: 2px 4px 2px 10px; border-radius: 3px; display: inline-flex; gap: 4px; align-items: center; }
.rchips .rc button { border: 0; background: none; color: inherit; cursor: pointer; font-size: 1rem; line-height: 1; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 4px; z-index: 60; font-size: .92rem; max-width: 90vw; }
.bigimg { max-width: 100%; max-height: 75vh; display: block; margin: 0 auto; }
.lockmsg { font-size: .86rem; color: var(--muted); background: var(--sunken); padding: 6px 10px; }

/* ===== รุ่น 2: หน้าตาใช้ง่ายขึ้น ===== */
.stack { display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--accent); padding: 8px 18px 0; }
.brandline { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; }
.brandmark { font-size: 1.7rem; font-weight: 700; color: var(--accent); letter-spacing: .04em; line-height: 1; }
.brandsub { font-size: .8rem; line-height: 1.3; color: var(--muted); }
.top .nav { border: 0; flex: 1; align-self: flex-end; }
.top .nav button { padding: 10px 14px 12px; font-size: 1rem; }
.top .who { text-align: right; font-size: .86rem; line-height: 1.35; padding-bottom: 8px; }
.top .who b { display: block; } .top .who span { color: var(--muted); }
.proto { padding: 6px 12px; font-size: .86rem; }
.pagehead { display: flex; align-items: center; gap: 12px; } .pagehead h2 { font-size: 1.4rem; } .pagehead .sp { flex: 1; }
.todo { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--warn); padding: 10px 16px; display: flex; flex-direction: column; gap: 2px; }
.todo-h { font-weight: 700; margin-bottom: 4px; }
.todo-r { display: flex; gap: 12px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line); }
.filt { gap: 12px; }
.tabsw { display: flex; flex-wrap: wrap; gap: 6px; align-self: flex-start; }
.tabsw button { white-space: nowrap; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 7px 16px; min-height: 40px; font-weight: 600; cursor: pointer; color: var(--ink); }
.tabsw button:hover { border-color: var(--accent); }

.tabsw button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.fline { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 12px; align-items: start; }
.fline .flab { font-weight: 600; color: var(--muted); font-size: .9rem; padding-top: 9px; }
.fline.sub { background: var(--accent-soft); margin: -4px -8px; padding: 6px 8px; border-radius: 6px; }
.filt { gap: 10px; }
.frow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.frow .search { grid-column: span 2; }
.resbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.resbar .sp { flex: 1; } .resbar .cnt { color: var(--muted); } .resbar .cnt b { color: var(--ink); }
.month { font-size: .9rem; color: var(--muted); font-weight: 700; margin: 6px 0 -6px; }
.mgroup { display: flex; flex-direction: column; border: 1px solid var(--line); background: var(--surface); }
.mrow { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto 14px; gap: 6px 16px; align-items: center; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 16px; text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%; }
.mrow:first-child { border-top: 0; }
.mrow:hover { background: var(--accent-soft); }
.mdate { font-weight: 600; font-size: .92rem; }
.mtitle { font-weight: 700; font-size: 1.03rem; line-height: 1.4; }
.mmeta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: .85rem; color: var(--muted); margin-top: 3px; }
.mside { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: .86rem; }
.dcs { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); justify-content: flex-end; } .dcs b { color: var(--ink); }
.mine { font-size: .8rem; font-weight: 600; padding: 0 8px; border-radius: 3px; }
.mine.ok { background: var(--ok-soft); color: var(--ok); } .mine.todo { background: var(--warn-soft); color: var(--warn); }
.chev { color: var(--muted); font-size: 1.5rem; line-height: 1; }
.mhead { gap: 6px; } .mhead h2 { font-size: 1.45rem; }
.meta2 { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font-size: .94rem; }
.meta2 .route a { color: var(--accent); }
.tabs button .you { display: block; font-size: .68rem; font-weight: 600; line-height: 1; opacity: .85; }
.item { border-left: 1px solid var(--line); gap: 8px; }
.ihead { display: flex; gap: 12px; align-items: flex-start; }
.num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; font-size: .9rem; margin-top: 2px; }
.itext { flex: 1; min-width: 0; }
.iacts { display: flex; gap: 6px; flex: none; }
.lab { font-size: .78rem; font-weight: 700; color: var(--muted); }
.irec { margin-left: 40px; background: var(--sunken); padding: 8px 12px; border-radius: 4px; }
.thumbs.ind, .item .foot { margin-left: 40px; }
.dsec > h3 { font-size: 1rem; }
.addbox { background: var(--surface); border: 2px dashed var(--accent); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.addbox h3 { font-size: 1.02rem; color: var(--accent); }
.addgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
details summary { cursor: pointer; color: var(--accent); font-size: .92rem; }
@media (max-width: 760px) {
  .top .who { text-align: left; order: -1; width: 100%; padding: 0; }
  .frow .search { grid-column: 1 / -1; }
  .mrow { grid-template-columns: minmax(0, 1fr) 14px; }
  .mrow .mdate, .mrow .mmain, .mrow .mside { grid-column: 1; }
  .mrow .chev { grid-column: 2; grid-row: 1 / 4; }
  .mside { align-items: flex-start; } .dcs { justify-content: flex-start; }
  .addgrid { grid-template-columns: 1fr; }
  .tabsw button { padding: 6px 12px; }
  .fline { grid-template-columns: 1fr; } .fline .flab { padding-top: 0; }
  .todo-r { flex-wrap: wrap; gap: 2px 12px; }
  .todo-r > span:nth-child(2) { flex-basis: 60% !important; }
  .irec, .thumbs.ind, .item .foot { margin-left: 0; }
}

/* ===== GSE รุ่นใหม่ ===== */
.tabsw.sm button { min-height: 32px; padding: 4px 10px; font-size: .86rem; font-weight: 500; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.kpis > div { background: var(--sunken); padding: 8px 12px; border-radius: 4px; display: flex; flex-direction: column; }
.kpis b { font-size: 1.35rem; line-height: 1.2; } .kpis span { font-size: .8rem; color: var(--muted); }
.glist { display: flex; flex-direction: column; }
.gline { display: grid; grid-template-columns: 200px auto 1fr; gap: 6px 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.gline:first-child { border-top: 0; }
.gname { font-weight: 600; }
.minin { width: 70px; padding: 4px 6px; display: inline-block; }
.tabsw button.st-ok[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.tabsw button.st-late[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #fff; }
.tabsw button.st-no[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.tabsw button.st-wait[aria-pressed="true"] { background: var(--muted); border-color: var(--muted); color: #fff; }
.addbox ul { margin: 6px 0 0; padding-left: 20px; color: var(--muted); }
@media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .gline { grid-template-columns: 1fr; } }

/* ===== รุ่น 5: หน้าตาชุดเดียวกับ OPS 602 (repo app, Version 2.1: งาช้าง น้ำเงิน ทอง) ===== */
:root {
  --bg: #f6f1e7; --surface: #fdfbf6; --sunken: #f0e9da; --ink: #0f2a4a; --muted: #5d6672; --line: #e5dbc7;
  --accent: #0f2a4a; --accent-ink: #f3e2bd; --accent-soft: #efe7d3;
  --gold: #bd9148; --gold-text: #86622a; --gold-hi: #eed6a3; --shadow: rgba(15, 42, 74, .10);
  --navy-deep: #0a2140; --navy: #0f2a4a; --navy-lift: #123a66;
  --ok: #1c6b45; --ok-soft: #e1eedd; --warn: #86622a; --warn-soft: #f6e9c9; --bad: #b3261e; --bad-soft: #f6dfd9;
  --font: "IBM Plex Sans Thai", "Noto Sans Thai", Tahoma, sans-serif;
  --font-display: "Cormorant Garamond", "Noto Serif Thai", Georgia, serif;
}

html.dark {
    --bg: #0b1524; --surface: #111f34; --sunken: #0e1a2c; --ink: #f1eadc; --muted: #a3adba; --line: #22334b;
    --accent: #e2c58e; --accent-ink: #0b1524; --accent-soft: #1a2c47;

<script>
/* ธีม: auto = ตามเวลาเครื่อง (06:00–17:59 สว่าง, นอกนั้นมืด) · light / dark = ผู้ใช้เลือกเอง */
const THEME_KEY = 'aar602-theme';
function themeMode() { try { const m = localStorage.getItem(THEME_KEY); return m === 'light' || m === 'dark' ? m : 'auto'; } catch (e) { return 'auto'; } }
function autoDark() { const h = new Date().getHours(); return h < 6 || h >= 18; }
function applyTheme() {
  const m = themeMode(), dark = m === 'dark' || (m === 'auto' && autoDark());
  document.documentElement.classList.toggle('dark', dark);
  document.querySelectorAll('#thmbtn, [data-thm-m]').forEach(b => {
  {
    const ic = dark ? '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>'
                    : '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g></svg>';
    b.innerHTML = ic + '<span class="tl">ธีม</span><svg viewBox="0 0 12 8" width="9" height="6" aria-hidden="true"><path d="M1 1.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    b.title = 'เปลี่ยนธีม (ตอนนี้: ' + (m === 'auto' ? 'อัตโนมัติตามเวลา' : dark ? 'มืด' : 'สว่าง') + ')';
  }
  });
}
applyTheme();
setInterval(applyTheme, 60000);
document.addEventListener('DOMContentLoaded', applyTheme);
</script>

function labelTables(root) {

        if (rs > 1) carry[col] = rs - 1;

    });
  });
}

function drawThumbs() {

}
function shrink(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const k = Math.min(1, 900 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .72));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
function draftFromEditor() { return { issue: $('#e-issue').value.trim(), rec: $('#e-rec').value.trim(), repeatOf: $('#e-rep').value || null, photos: ED.photos.slice() }; }
function diffText(a, b) {
  const out = [];
  if (a.issue !== b.issue) out.push(`ข้อขัดข้อง: “${cut(a.issue, 50)}” → “${cut(b.issue, 50)}”`);
  if (a.rec !== b.rec) out.push(`ข้อเสนอแนะ: “${cut(a.rec, 50)}” → “${cut(b.rec, 50)}”`);
  if ((a.photos || []).length !== (b.photos || []).length) out.push(`รูป: ${(a.photos || []).length} → ${(b.photos || []).length}`);
  if ((a.repeatOf || null) !== (b.repeatOf || null)) out.push(b.repeatOf ? 'ระบุว่าเป็นปัญหาเกิดซ้ำ' : 'ยกเลิกการระบุว่าเกิดซ้ำ');
  return out.join('\n') || 'ไม่มีการเปลี่ยนแปลงเนื้อหา';
}

    logItem(cur.dept, forceConflictNote ? 'CONFLICT' : 'UPDATE', m.title, (forceConflictNote ? forceConflictNote + '\n' : '') + diffText(before, cur));

  if ('gmin' in t.dataset) {
    const e = evById(t.dataset.eid); const it = e && e.items[t.dataset.item];
    if (it) { it.min = Math.max(0, +t.value || 0); log(kindOf(e).k, 'GSE_ITEM', evTag(e), `${t.dataset.item}: มาช้า ${it.min} นาที`); save(); }
  }

});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.fsel === 'q') { F.q = t.value; renderResults(); }
  if ('gq' in t.dataset) { G.q = t.value; const pos = t.selectionStart; render(); const n = $('[data-gq]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) {} } }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#thmpop')) { $('#thmpop').remove(); $('#thmbtn').focus(); return; } if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });

/* ====== เข้าใช้งาน: Login กลาง → บัตรผ่านของเว็บนี้ → ข้อมูล ======
   ไม่มีการ Login: ไปหน้าเข้าสู่ระบบ แล้วกลับมาที่นี่ · การหมดเวลา 1 ชั่วโมง การ Login ซ้อนจากเครื่องอื่น
   และการออกจากระบบในแท็บอื่น ดูแลโดย App.watch (eadmin/assets/app.js) แบบเดียวกับทุกเว็บของ ฝูง.602 */
const AUTH = window.App || null;
let started = false, lastRenew = 0;
function showLock(on, msg, go, out) {
  $('#lock').hidden = !on; $('#app').hidden = on;
  if (on) { closeModal && $('#modal-root').innerHTML && closeModal(); $('#lockMsg').textContent = msg || ''; $('#lockGo').hidden = !go; $('#lockOut').hidden = !out; }
}
$('#lockGo').addEventListener('click', () => { if (AUTH) location.href = AUTH.loginUrl().split('?')[0]; });
$('#lockOut').addEventListener('click', () => { if (AUTH) AUTH.signOut(); });
function setMe(m) {
  if (!m) return;
  U = { dept: m.dept || '', role: m.role || 'Viewer', name: m.name || '', user: m.user || '', super: !!m.super };
}
function uiBusy() {
  const a = document.activeElement;
  return !!$('#modal-root').innerHTML || !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.value) || !!CMOPEN;
}
if (window.AAR) {
  window.AAR.state = () => S;
  window.AAR.busy = uiBusy;
  window.AAR.onData = (nS, m, why) => {
    const before = U.role + U.dept;
    S = nS; setMe(m);
    if (why === 'remote' && uiBusy()) return;
    render();
    if (before !== U.role + U.dept && why === 'remote') toast('สิทธิ์ของบัญชีนี้เปลี่ยนเป็น ' + U.role);
  };
}
window.addEventListener('app-toast', e => { if (e.detail) toast(e.detail); });
// สถานะการบันทึก (มุมล่างซ้าย): กำลังบันทึก… → บันทึกแล้ว
let saveT = null;
window.addEventListener('aar-saving', e => {
  let el = $('#savepill'); if (!el) { el = document.createElement('div'); el.id = 'savepill'; el.setAttribute('role', 'status'); document.body.append(el); }
  clearTimeout(saveT);
  if (e.detail) { el.textContent = 'กำลังบันทึก…'; el.className = 'on'; }
  else { el.textContent = '✓ บันทึกแล้ว'; el.className = 'on done'; saveT = setTimeout(() => { el.className = ''; }, 1800); }
});
window.addEventListener('app-denied', e => { showLock(true, e.detail || 'บัญชีนี้ไม่มีสิทธิ์ใช้งานเว็บนี้ ให้ติดต่อ Admin', true, true); });
window.addEventListener('app-auth-lost', () => {
  if (!AUTH || !AUTH.session()) { if (AUTH) AUTH.toLogin(); return; }
  if (Date.now() - lastRenew < 30000) return;
  lastRenew = Date.now();
  AUTH.api('me').then(() => window.AAR.renew()).catch(() => {});
});
document.addEventListener('focusout', () => setTimeout(() => { if (window.AAR && !uiBusy()) window.AAR.idle(); }, 300));
async function startApp() {
  showLock(true, 'กำลังตรวจสิทธิ์…');
  let r;
  try { r = await window.AAR.start(); }
  catch (e) {
    if (e && (e.code === 'no_web' || e.code === 'web_closed' || e.code === 'wrong_web')) { showLock(true, e.message, true, true); return; }
    if (e && e.code === 'auth') return;          // App พาไปหน้าเข้าสู่ระบบแล้ว
    const hint = e && (e.code === 'config' || e.code === 'busy') ? ' · ตรวจ SETUP ใน Apps Script แล้ว Run setup' : '';
    showLock(true, ((e && e.message) || 'ตรวจสิทธิ์ไม่สำเร็จ') + hint + ' · จะลองใหม่อีกครั้ง', false, true); setTimeout(startApp, 15000); return;
  }
  S = r.S; setMe(r.me); started = true;
  showLock(false); render(); applyTheme();
}
if (!AUTH || !AUTH.hasBackend || !window.AAR) showLock(true, 'ไม่พบระบบ Login กลาง (eadmin) หน้านี้จึงยังใช้งานไม่ได้', false, false);
else if (!AUTH.session()) AUTH.toLogin();
else {
  AUTH.watch((s, was) => { if (!s) { AUTH.toLogin(); return; } if (was && s.token !== was) location.reload(); });
  startApp();
}
</script>

<script src="/app/back.js" defer></script>
